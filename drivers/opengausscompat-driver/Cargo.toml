[package]
name = "opengausscompat-driver"
version = "0.1.0"
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "gaussdb-driver"
path = "src/bin/gaussdb.rs"

[[bin]]
name = "vastbase-driver"
path = "src/bin/vastbase.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
extension-driver.workspace = true
extension-protocol.workspace = true
interprocess.workspace = true
native-tls.workspace = true
opengauss-native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync"] }
tokio-opengauss.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
extension-host.workspace = true
