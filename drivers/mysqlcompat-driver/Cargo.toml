[package]
name = "mysqlcompat-driver"
version = "0.1.0"
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mariadb-driver"
path = "src/bin/mariadb.rs"

[[bin]]
name = "tidb-driver"
path = "src/bin/tidb.rs"

[[bin]]
name = "doris-driver"
path = "src/bin/doris.rs"

[[bin]]
name = "starrocks-driver"
path = "src/bin/starrocks.rs"

[[bin]]
name = "selectdb-driver"
path = "src/bin/selectdb.rs"

[[bin]]
name = "polardb-mysql-driver"
path = "src/bin/polardb-mysql.rs"

[[bin]]
name = "greatsql-driver"
path = "src/bin/greatsql.rs"

[[bin]]
name = "tdsql-driver"
path = "src/bin/tdsql.rs"

[[bin]]
name = "goldendb-driver"
path = "src/bin/goldendb.rs"

[[bin]]
name = "dolt-driver"
path = "src/bin/dolt.rs"

[[bin]]
name = "databend-driver"
path = "src/bin/databend.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
extension-driver.workspace = true
extension-protocol.workspace = true
interprocess.workspace = true
mysql_async.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
extension-host.workspace = true
